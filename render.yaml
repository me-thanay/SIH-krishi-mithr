services:
  - type: web
    name: sih-krishi-mithr-api
    # Native Python: Dashboard must use this buildCommand (torch is not in requirements.txt alone).
    # Alternative: switch Language to Docker and use Dockerfile.render (also installs CPU torch).
    runtime: python
    # ML (torch + YOLO + EfficientNet) needs ~2 GB RAM. Free/Starter (512 MB) will OOM.
    plan: standard
    region: oregon
    buildCommand: PIP_REQUIRE_HASHES=0 pip install --no-cache-dir --upgrade pip && PIP_REQUIRE_HASHES=0 pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && PIP_REQUIRE_HASHES=0 pip install --no-cache-dir -r requirements.render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: "."
      - key: INFERENCE_DEVICE
        value: cpu
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DEVICE_UPLOAD_KEY
        sync: false
