services:
  - type: web
    name: sih-krishi-mithr-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.backend.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: "."
      - key: DATABASE_URL
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
