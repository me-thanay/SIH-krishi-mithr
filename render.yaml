services:
  - type: web
    name: sih-krishi-mithr-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
